name: slum-i-segformer-benchmark

services:
  benchmark:
    image: slum-i-segmentation-benchmark:arm64
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
    platform: linux/arm64
    command:
      - --model
      - segformer_b5_islamabad
      - --batch-size
      - "5"
      - --cpu-limit
      - "2"
      - --results-dir
      - benchmarks/results_10_mruns/segformer_b5_islamabad_cpu2_b5
    cpus: 2.0
    mem_limit: 6g
    memswap_limit: 6g
    network_mode: none
    volumes:
      - ../models:/app/models:ro
      - ./data:/app/benchmarks/data:ro
      - ./results_10_mruns:/app/benchmarks/results_10_mruns
