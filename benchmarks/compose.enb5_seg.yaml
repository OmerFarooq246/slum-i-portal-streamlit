name: slum-i-enb5-seg-benchmark

services:
  benchmark:
    image: slum-i-segmentation-benchmark:arm64
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
    platform: linux/arm64
    command:
      - --model
      - enb5_seg_islamabad
      - --batch-size
      - "3"
      - --cpu-limit
      - "2"
      - --results-dir
      - benchmarks/results/enb5_seg_islamabad_b3
    cpus: 2.0
    mem_limit: 6g
    memswap_limit: 6g
    network_mode: none
    volumes:
      - ../models:/app/models:ro
      - ./data:/app/benchmarks/data:ro
      - ./results:/app/benchmarks/results
