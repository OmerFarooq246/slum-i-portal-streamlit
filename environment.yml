channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - folium>=0.17,<1
  - gdal>=3.9,<4
  - leafmap>=0.35,<1
  - numpy=1.26.4
  - pillow>=12.3,<13
  - pip
  - streamlit>=1.54,<2
  - streamlit-folium>=0.22,<1
  - mypy>=1.16,<2
  - pip-audit>=2.9,<3
  - pre-commit>=4.2,<5
  - pytest>=9.0.3,<10
  - pytest-cov>=6.2,<7
  - ruff>=0.11,<1
  - pip:
      # Use wheels for TensorFlow and PyArrow together. The conda-forge
      # PyArrow native libraries conflict with TensorFlow on Apple Silicon.
      - numpy==1.26.4
      - pyarrow==23.0.1
      - tensorflow==2.20.0
