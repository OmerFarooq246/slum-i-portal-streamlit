name: slum-i-enb5-seg-benchmark

services:
  benchmark:
    image: slum-i-segmentation-benchmark:arm64
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
    platform: linux/arm64
    command:
      - --model
      - enb5_seg_islamabad
      - --batch-size
      - "1"
      - --cpu-limit
      - "2"
      - --measured-runs
      - "5"
      - --warmup-runs
      - "1"
      - --results-dir
      - benchmarks/results_5_mruns/enb5_seg_islamabad_cpu2_b1_new
    cpus: 2.0
    mem_limit: 6g
    memswap_limit: 6g
    network_mode: none
    volumes:
      - ../models:/app/models:ro
      - ./data:/app/benchmarks/data:ro
      - ./results_5_mruns:/app/benchmarks/results_5_mruns
